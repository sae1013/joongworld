  <section class="container-xl my-4">
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mb-3">
      <div>
        <p class="text-secondary small mb-1">지난 24시간 내 등록</p>
        <h2 class="h5 fw-bold m-0">최근 등록된 상품이예요!</h2>
      </div>
      <div class="btn-group"
           role="group"
           aria-label="스크롤 제어"
           data-controls="recentProductsRow"
           th:if="${recentProducts != null and !#lists.isEmpty(recentProducts)}">
        <button class="btn btn-outline-light" type="button">◀</button>
        <button class="btn btn-outline-light" type="button">▶</button>
      </div>
    </div>
    <p class="text-secondary mb-3">
      카테고리 구분 없이 하루 동안 새로 올라온 상품을 한눈에 확인해 보세요.
    </p>

    <div id="recentProductsRow"
         class="h-scroll"
         th:if="${recentProducts != null and !#lists.isEmpty(recentProducts)}">
      <a class="prod-card"
         th:each="product : ${recentProducts}"
         th:href="@{|/product/${product.id}|}">
        <div class="prod-img"
             th:style="${product.thumbnailUrl != null} ? |background-image:url('/files/${product.thumbnailUrl}')| : null"></div>
        <div class="p-3">
          <div class="text-secondary small mb-1" th:text="${product.categoryName}">카테고리</div>
          <h3 class="fs-6 fw-semibold mb-1 text-truncate" th:text="${product.title}">상품 제목</h3>
          <div class="fw-bold" th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')} + '원'">0원</div>
          <div class="text-secondary small d-flex align-items-center justify-content-between mt-2">
            <span th:text="${product.region}">지역</span>
            <span th:text="${#temporals.format(product.createdAt, 'M/d HH:mm')}">3/14 13:20</span>
          </div>
          <div class="mt-2" th:if="${product.safePay}">
            <span class="badge bg-success-subtle text-dark fw-semibold">안전결제</span>
          </div>
        </div>
      </a>
    </div>

    <div class="alert alert-secondary text-secondary mb-0"
         th:if="${recentProducts == null or #lists.isEmpty(recentProducts)}">
      최근 24시간 동안 등록된 상품이 없습니다. 잠시 후 다시 확인해 주세요.
    </div>
  </section>

    const homePage = new window.HomePage({
      url: '/search',
    });
    homePage.init();
  });
</script>
