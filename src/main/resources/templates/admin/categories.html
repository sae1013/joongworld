<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>카테고리 관리 | 중고마켓</title>
    <th:block th:replace="fragments/header :: globalHead"></th:block>
    <link rel="stylesheet" href="/css/admin/dashboard.css" th:href="@{/css/admin/dashboard.css}">
</head>
<body class="admin-dashboard-page">
<div class="dashboard-shell">
    <div th:replace="fragments/header :: siteHeader"></div>
    <div class="admin-console">
        <div th:replace="fragments/admin :: sidebar(${adminActiveMenu})"></div>
        <div class="admin-console__content">
            <main class="dashboard-main">
                <header class="dashboard-header">
                    <div>
                        <p class="dashboard-badge">운영 도구</p>
                        <h1>카테고리 관리</h1>
                        <p class="dashboard-sub">거래에 사용되는 카테고리를 등록하고 정렬 순서를 조정합니다.</p>
                    </div>
                    <div class="dashboard-meta">
                        <span class="meta-label">총 카테고리</span>
                        <strong th:text="${categories != null ? categories.size() : 0} + '개'">0개</strong>
                    </div>
                </header>

                <section class="dashboard-panel">
                    <header class="panel-header">
                        <div>
                            <h2>카테고리 목록</h2>
                            <p class="panel-sub">카테고리를 추가하거나 편집할 수 있습니다.</p>
                        </div>
                        <div class="panel-actions">
                            <button type="button" class="panel-btn panel-btn--primary" data-action="create-category">카테고리 추가</button>
                        </div>
                    </header>
                    <div class="panel-body">
                        <div class="table-card">
                            <div class="table-scroller">
                                <table class="dashboard-table">
                                    <thead>
                                    <tr>
                                        <th scope="col">카테고리명</th>
                                        <th scope="col">표시 순서</th>
                                        <th scope="col">상태</th>
                                        <th scope="col" class="cell-actions">관리</th>
                                    </tr>
                                    </thead>
                                    <tbody id="categoryTableBody">
                                    <tr class="table-empty">
                                        <td colspan="4">
                                            <p>등록된 카테고리가 없습니다.</p>
                                            <span>카테고리를 추가하면 이곳에 표시됩니다.</span>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
            <div th:replace="fragments/footer :: siteFooter"></div>
        </div>
    </div>
</div>

<th:block th:replace="fragments/footer :: globalScripts"></th:block>
<th:block th:if="${categories != null}">
    <script th:inline="javascript">
        window.__ADMIN_DASHBOARD__ = Object.assign(window.__ADMIN_DASHBOARD__ || {}, {
            categories: [[${categories}]]
        });
    </script>
</th:block>
<script src="/js/admin/dashboard.js" th:src="@{/js/admin/dashboard.js}"></script>
</body>
</html>
